<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3f4a56"/></marker></defs>
  <style>.t{font:700 24px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.h{font:700 15px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.p{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#4b5966}.state{fill:#fff;stroke:#566676;stroke-width:1.35;rx:22}.line{stroke:#3f4a56;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.dot{fill:#1f2d3d}</style>
  <rect width="1180" height="560" fill="#fff"/><text x="590" y="42" text-anchor="middle" class="t">推理引擎状态图</text>
  <circle cx="90" cy="260" r="13" class="dot"/>
  <rect x="160" y="225" width="160" height="70" class="state"/><text x="240" y="254" text-anchor="middle" class="h">未加载模型</text><text x="240" y="276" text-anchor="middle" class="p">Loading</text>
  <rect x="390" y="225" width="160" height="70" class="state"/><text x="470" y="254" text-anchor="middle" class="h">空闲</text><text x="470" y="276" text-anchor="middle" class="p">Idle</text>
  <rect x="620" y="225" width="160" height="70" class="state"/><text x="700" y="254" text-anchor="middle" class="h">运行中</text><text x="700" y="276" text-anchor="middle" class="p">Running</text>
  <rect x="850" y="225" width="160" height="70" class="state"/><text x="930" y="254" text-anchor="middle" class="h">停止中</text><text x="930" y="276" text-anchor="middle" class="p">Stopping</text>
  <rect x="390" y="390" width="160" height="70" class="state"/><text x="470" y="419" text-anchor="middle" class="h">错误</text><text x="470" y="441" text-anchor="middle" class="p">Error</text>
  <circle cx="1090" cy="260" r="13" fill="#fff" stroke="#1f2d3d" stroke-width="3"/>
  <path d="M103 260 H160" class="line"/><path d="M320 260 H390" class="line"/><text x="355" y="248" text-anchor="middle" class="p">加载成功</text><path d="M550 260 H620" class="line"/><text x="585" y="248" text-anchor="middle" class="p">启动检测</text><path d="M780 260 H850" class="line"/><text x="815" y="248" text-anchor="middle" class="p">停止检测</text><path d="M1010 260 H1077" class="line"/><text x="1040" y="248" text-anchor="middle" class="p">释放完成</text>
  <path d="M930 295 V330 H470 V295" class="line"/><text x="700" y="350" text-anchor="middle" class="p">释放资源后回到空闲</text>
  <path d="M240 295 V425 H390" class="line"/><text x="315" y="410" text-anchor="middle" class="p">加载失败</text>
  <path d="M700 295 V425 H550" class="line"/><text x="630" y="410" text-anchor="middle" class="p">视频源或推理异常</text>
  <path d="M470 390 V295" class="line"/><text x="520" y="350" class="p">修正配置</text>
</svg>
