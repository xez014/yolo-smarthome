  <rect x="605" y="598" width="145" height="56" class="box"/><text x="677" y="621" text-anchor="middle" class="h">OpenCV</text><text x="677" y="641" text-anchor="middle" class="p">解码 / 绘图</text>
  <rect x="785" y="598" width="145" height="56" class="box"/><text x="857" y="621" text-anchor="middle" class="h">MySQL</text><text x="857" y="641" text-anchor="middle" class="p">业务数据</text>
