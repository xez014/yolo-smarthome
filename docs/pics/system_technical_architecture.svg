  <rect x="650" y="263" width="170" height="56" class="box"/><text x="735" y="286" text-anchor="middle" class="h">WebSocket</text><text x="735" y="306" text-anchor="middle" class="p">实时状态 / 推流</text>
  <rect x="70" y="390" width="1140" height="145" class="lane"/><rect x="70" y="390" width="140" height="145" class="head"/><text x="140" y="458" text-anchor="middle" class="h">后端服务层</text>
  <rect x="260" y="423" width="155" height="58" class="box"/><text x="337" y="447" text-anchor="middle" class="h">FastAPI</text><text x="337" y="467" text-anchor="middle" class="p">REST / 路由</text>
  <rect x="455" y="423" width="155" height="58" class="box"/><text x="532" y="447" text-anchor="middle" class="h">Auth</text><text x="532" y="467" text-anchor="middle" class="p">JWT 鉴权</text>
  <rect x="650" y="423" width="155" height="58" class="box"/><text x="727" y="447" text-anchor="middle" class="h">DetectionEngine</text><text x="727" y="467" text-anchor="middle" class="p">推理 / 绘框 / 写库</text>
  <rect x="845" y="423" width="155" height="58" class="box"/><text x="922" y="447" text-anchor="middle" class="h">Cleaner</text><text x="922" y="467" text-anchor="middle" class="p">快照清理</text>
  <rect x="70" y="575" width="1140" height="105" class="lane"/><rect x="70" y="575" width="140" height="105" class="head"/><text x="140" y="622" text-anchor="middle" class="h">算法与数据层</text>
