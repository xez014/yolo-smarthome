<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3f4a56"/></marker></defs>
  <style>
    .t{font:700 24px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.h{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.p{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#4b5966}
    .lane{fill:#f8fafc;stroke:#b8c2cc;stroke-width:1.2}.head{fill:#eef3f8;stroke:#b8c2cc;stroke-width:1.2}.box{fill:#fff;stroke:#566676;stroke-width:1.3;rx:5}.line{stroke:#3f4a56;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.soft{stroke:#6f7f90;stroke-width:1.25;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow)}
  </style>
  <rect width="1280" height="820" fill="#fff"/><text x="640" y="42" text-anchor="middle" class="t">系统技术架构图</text>
  <rect x="70" y="80" width="1140" height="115" class="lane"/><rect x="70" y="80" width="140" height="115" class="head"/><text x="140" y="133" text-anchor="middle" class="h">客户端层</text>
  <rect x="270" y="108" width="170" height="56" class="box"/><text x="355" y="131" text-anchor="middle" class="h">浏览器</text><text x="355" y="151" text-anchor="middle" class="p">Vue 3 / Element Plus</text>
  <rect x="505" y="108" width="170" height="56" class="box"/><text x="590" y="131" text-anchor="middle" class="h">媒体采集</text><text x="590" y="151" text-anchor="middle" class="p">getUserMedia / Canvas</text>
  <rect x="740" y="108" width="170" height="56" class="box"/><text x="825" y="131" text-anchor="middle" class="h">页面功能</text><text x="825" y="151" text-anchor="middle" class="p">监控 / 检索 / 统计</text>
  <rect x="70" y="235" width="1140" height="115" class="lane"/><rect x="70" y="235" width="140" height="115" class="head"/><text x="140" y="288" text-anchor="middle" class="h">接入代理层</text>
