<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3f4a56"/></marker></defs>
  <style>.t{font:700 24px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.h{font:700 14px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.p{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#4b5966}.head{fill:#fff;stroke:#566676;stroke-width:1.3;rx:5}.life{stroke:#9aa8b5;stroke-width:1.2;stroke-dasharray:6 5}.msg{stroke:#3f4a56;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.ret{stroke:#6f7f90;stroke-width:1.25;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow)}.act{fill:#f8fafc;stroke:#b8c2cc;stroke-width:1.1;rx:4}</style>
