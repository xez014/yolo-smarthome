<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3f4a56"/></marker></defs>
  <style>.t{font:700 24px "Microsoft YaHei",Arial,sans-serif;fill:#1f2d3d}.h{font:700 16px "Microsoft YaHei",Arial,sans-serif;fill:#fff}.p{font:13px "Consolas","Microsoft YaHei",monospace;fill:#2f3b46}.n{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#4b5966}.box{fill:#fff;stroke:#566676;stroke-width:1.35;rx:4}.head{fill:#566676}.line{stroke:#3f4a56;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1180" height="610" fill="#fff"/><text x="590" y="42" text-anchor="middle" class="t">核心数据实体关系图</text>
  <g transform="translate(80,100)"><rect width="300" height="350" class="box"/><rect width="300" height="42" class="head"/><text x="150" y="27" text-anchor="middle" class="h">DetectionRecord</text><text x="20" y="72" class="p">id</text><text x="20" y="100" class="p">object_class</text><text x="20" y="128" class="p">class_id</text><text x="20" y="156" class="p">confidence</text><text x="20" y="184" class="p">bbox_x_y_w_h</text><text x="20" y="212" class="p">track_id</text><text x="20" y="240" class="p">snapshot_path</text><text x="20" y="268" class="p">detected_at</text><text x="20" y="296" class="p">camera_id</text></g>
  <g transform="translate(470,100)"><rect width="300" height="310" class="box"/><rect width="300" height="42" class="head"/><text x="150" y="27" text-anchor="middle" class="h">ObjectLastSeen</text><text x="20" y="72" class="p">id</text><text x="20" y="100" class="p">object_class</text><text x="20" y="128" class="p">class_id</text><text x="20" y="156" class="p">last_bbox_x_y_w_h</text><text x="20" y="184" class="p">last_snapshot_path</text><text x="20" y="212" class="p">last_seen_at</text><text x="20" y="240" class="p">total_count</text><text x="20" y="268" class="p">camera_id</text></g>
  <g transform="translate(860,100)"><rect width="250" height="250" class="box"/><rect width="250" height="42" class="head"/><text x="125" y="27" text-anchor="middle" class="h">DetectionStat</text><text x="20" y="72" class="p">id</text><text x="20" y="100" class="p">stat_date</text><text x="20" y="128" class="p">stat_hour</text><text x="20" y="156" class="p">object_class</text><text x="20" y="184" class="p">detection_count</text></g>
  <path d="M380 230 H470" class="line"/><text x="425" y="214" text-anchor="middle" class="n">updates</text>
  <path d="M380 300 H860" class="line"/><text x="620" y="284" text-anchor="middle" class="n">aggregates</text>
  <text x="590" y="535" text-anchor="middle" class="n">DetectionRecord 是原始检测明细，ObjectLastSeen 和 DetectionStat 分别由检测明细更新与聚合得到。</text>
</svg>
