    .ent,.ds{fill:#fff;stroke:#566676;stroke-width:1.35;rx:4}.proc{fill:#fff;stroke:#566676;stroke-width:1.5}.line{stroke:#3f4a56;stroke-width:1.55;fill:none;marker-end:url(#arrow)}
  </style>
