<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4a56"/>
    </marker>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2d3d; }
      .note { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52606d; }
      .lane-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #243447; }
      .node-title { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2d3d; }
      .node-text { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5966; }
      .caption { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #596775; }
      .lane { fill: #f8fafc; stroke: #b8c2cc; stroke-width: 1.2; }
      .lane-alt { fill: #ffffff; stroke: #b8c2cc; stroke-width: 1.2; }
      .label-band { fill: #eef3f8; stroke: #b8c2cc; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #5f6f80; stroke-width: 1.3; }
      .node-light { fill: #fbfdff; stroke: #7b8da0; stroke-width: 1.2; }
      .storage { fill: #ffffff; stroke: #5f6f80; stroke-width: 1.3; }
      .line { stroke: #3f4a56; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .line-soft { stroke: #6f7f90; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .line-return { stroke: #6f7f90; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" class="title">智能家居视觉感知与历史物品检索系统总体架构</text>
  <text x="640" y="68" text-anchor="middle" class="note">前端交互、后端接口、模型推理、数据存储与容器化部署之间的关系</text>

  <!-- Layer 1 -->
  <rect x="60" y="96" width="1160" height="106" class="lane"/>
  <rect x="60" y="96" width="150" height="106" class="label-band"/>
  <text x="135" y="146" text-anchor="middle" class="lane-title">前端展示层</text>
  <text x="135" y="170" text-anchor="middle" class="caption">Vue 3 / Nginx</text>

  <rect x="252" y="116" width="150" height="66" class="node"/>
  <text x="327" y="142" text-anchor="middle" class="node-title">登录与初始化</text>
  <text x="327" y="164" text-anchor="middle" class="node-text">JWT / 数据库配置</text>

  <rect x="448" y="116" width="150" height="66" class="node"/>
  <text x="523" y="142" text-anchor="middle" class="node-title">实时监控页面</text>
  <text x="523" y="164" text-anchor="middle" class="node-text">视频画面 / 检测列表</text>

  <rect x="644" y="116" width="150" height="66" class="node"/>
  <text x="719" y="142" text-anchor="middle" class="node-title">本地推流组件</text>
  <text x="719" y="164" text-anchor="middle" class="node-text">摄像头 / 本地视频</text>

  <rect x="840" y="116" width="150" height="66" class="node"/>
  <text x="915" y="142" text-anchor="middle" class="node-title">检索与统计页面</text>
  <text x="915" y="164" text-anchor="middle" class="node-text">历史记录 / ECharts</text>

  <!-- Layer 2 -->
  <rect x="60" y="232" width="1160" height="118" class="lane-alt"/>
  <rect x="60" y="232" width="150" height="118" class="label-band"/>
  <text x="135" y="282" text-anchor="middle" class="lane-title">后端服务层</text>
  <text x="135" y="306" text-anchor="middle" class="caption">FastAPI</text>

  <rect x="242" y="258" width="132" height="66" class="node"/>
  <text x="308" y="284" text-anchor="middle" class="node-title">AuthRouter</text>
  <text x="308" y="306" text-anchor="middle" class="node-text">登录与鉴权</text>

  <rect x="410" y="258" width="132" height="66" class="node"/>
  <text x="476" y="284" text-anchor="middle" class="node-title">VideoRouter</text>
  <text x="476" y="306" text-anchor="middle" class="node-text">视频流 / 推流</text>

  <rect x="578" y="258" width="132" height="66" class="node"/>
  <text x="644" y="284" text-anchor="middle" class="node-title">DetectionRouter</text>
  <text x="644" y="306" text-anchor="middle" class="node-text">类别 / 检索</text>

  <rect x="746" y="258" width="132" height="66" class="node"/>
  <text x="812" y="284" text-anchor="middle" class="node-title">StatsRouter</text>
  <text x="812" y="306" text-anchor="middle" class="node-text">概览 / 趋势</text>

  <rect x="914" y="258" width="132" height="66" class="node"/>
  <text x="980" y="284" text-anchor="middle" class="node-title">SetupRouter</text>
  <text x="980" y="306" text-anchor="middle" class="node-text">测试 / 初始化</text>

  <!-- Layer 3 -->
  <rect x="60" y="380" width="1160" height="126" class="lane"/>
  <rect x="60" y="380" width="150" height="126" class="label-band"/>
  <text x="135" y="432" text-anchor="middle" class="lane-title">核心处理层</text>
  <text x="135" y="456" text-anchor="middle" class="caption">推理与持久化</text>

  <rect x="252" y="408" width="176" height="70" class="node"/>
  <text x="340" y="434" text-anchor="middle" class="node-title">DetectionEngine</text>
  <text x="340" y="456" text-anchor="middle" class="node-text">帧读取 / 结果解析 / 写库</text>

  <rect x="484" y="408" width="152" height="70" class="node"/>
  <text x="560" y="434" text-anchor="middle" class="node-title">YOLO11s</text>
  <text x="560" y="456" text-anchor="middle" class="node-text">20 类家居物品检测</text>

  <rect x="692" y="408" width="152" height="70" class="node"/>
  <text x="768" y="434" text-anchor="middle" class="node-title">ByteTrack</text>
  <text x="768" y="456" text-anchor="middle" class="node-text">Track ID 关联</text>

  <rect x="900" y="408" width="152" height="70" class="node"/>
  <text x="976" y="434" text-anchor="middle" class="node-title">OpenCV</text>
  <text x="976" y="456" text-anchor="middle" class="node-text">解码 / 拉流 / 绘框</text>

  <!-- Layer 4 -->
  <rect x="60" y="536" width="1160" height="116" class="lane-alt"/>
  <rect x="60" y="536" width="150" height="116" class="label-band"/>
  <text x="135" y="586" text-anchor="middle" class="lane-title">数据存储层</text>
  <text x="135" y="610" text-anchor="middle" class="caption">MySQL / 文件</text>

  <rect x="248" y="562" width="164" height="64" class="storage"/>
  <text x="330" y="588" text-anchor="middle" class="node-title">detection_records</text>
  <text x="330" y="610" text-anchor="middle" class="node-text">检测明细记录</text>

  <rect x="448" y="562" width="164" height="64" class="storage"/>
  <text x="530" y="588" text-anchor="middle" class="node-title">object_last_seen</text>
  <text x="530" y="610" text-anchor="middle" class="node-text">最后出现位置</text>

  <rect x="648" y="562" width="164" height="64" class="storage"/>
  <text x="730" y="588" text-anchor="middle" class="node-title">detection_stats</text>
  <text x="730" y="610" text-anchor="middle" class="node-text">小时级统计</text>

  <rect x="848" y="562" width="132" height="64" class="storage"/>
  <text x="914" y="588" text-anchor="middle" class="node-title">snapshots</text>
  <text x="914" y="610" text-anchor="middle" class="node-text">检测快照</text>

  <rect x="1016" y="562" width="132" height="64" class="storage"/>
  <text x="1082" y="588" text-anchor="middle" class="node-title">SmartHome-COCO</text>
  <text x="1082" y="610" text-anchor="middle" class="node-text">训练数据集</text>

  <!-- Layer 5 -->
  <rect x="60" y="680" width="1160" height="44" class="lane"/>
  <rect x="60" y="680" width="150" height="44" class="label-band"/>
  <text x="135" y="708" text-anchor="middle" class="lane-title">部署层</text>
  <rect x="252" y="690" width="154" height="24" class="node-light"/>
  <text x="329" y="707" text-anchor="middle" class="node-text">Docker Compose</text>
  <rect x="444" y="690" width="154" height="24" class="node-light"/>
  <text x="521" y="707" text-anchor="middle" class="node-text">Backend Container</text>
  <rect x="636" y="690" width="154" height="24" class="node-light"/>
  <text x="713" y="707" text-anchor="middle" class="node-text">Frontend Container</text>
  <rect x="828" y="690" width="154" height="24" class="node-light"/>
  <text x="905" y="707" text-anchor="middle" class="node-text">Healthcheck</text>

  <!-- Main flows -->
  <path class="line" d="M 327 182 V 258"/>
  <path class="line" d="M 523 182 V 258 H 476"/>
  <path class="line" d="M 719 182 V 258 H 476"/>
  <path class="line" d="M 915 182 V 258 H 812"/>
  <path class="line" d="M 476 324 V 408 H 340"/>
  <path class="line" d="M 644 324 V 408 H 340"/>
  <path class="line" d="M 812 324 V 562 H 730"/>
  <path class="line" d="M 980 324 V 562 H 530"/>
  <path class="line" d="M 428 443 H 484"/>
  <path class="line" d="M 636 443 H 692"/>
  <path class="line" d="M 844 443 H 900"/>
  <path class="line" d="M 340 478 V 562 H 330"/>
  <path class="line" d="M 340 478 V 562 H 530"/>
  <path class="line" d="M 340 478 V 562 H 730"/>
  <path class="line" d="M 340 478 V 562 H 914"/>
  <path class="line-soft" d="M 1082 562 V 478 H 560"/>

  <!-- Return and deployment relations -->
  <path class="line-return" d="M 900 594 H 812 V 324"/>
  <path class="line-soft" d="M 329 690 V 652"/>
  <path class="line-soft" d="M 521 690 V 506"/>
  <path class="line-soft" d="M 713 690 V 202"/>
  <path class="line-soft" d="M 905 690 V 652"/>
</svg>
