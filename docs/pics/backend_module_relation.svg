  <path d="M295 180 H430 V335 H465" class="line"/><path d="M295 255 H430 V335 H465" class="line"/><path d="M295 330 H430 V335 H465" class="line"/>
  <path d="M685 335 H815 V150" class="line"/><path d="M685 335 H770 V280 H815" class="line"/><path d="M685 335 H770 V410 H815" class="line"/>
